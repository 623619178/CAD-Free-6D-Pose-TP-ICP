[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tpicp-scale-recovery"
version = "0.1.0"
description = "Standalone Template-Point ICP metric scale recovery"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.23",
  "Pillow>=9.0",
  "scipy>=1.9",
  "trimesh>=3.20",
]

[project.scripts]
tpicp-scale = "tpicp.cli:main"
tpicp-single-query = "tpicp.pipeline:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
